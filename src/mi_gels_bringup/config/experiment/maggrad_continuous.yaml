# MI-GELS MagGrad continuous experiment configuration.
#
# This single file is loaded by:
#   - fy8300_signal.launch / signal_generator for FY8300 channel setup
#   - maggrad_continuous_collection_node.py for coil-state labels
#   - experiment_orchestrator.py for readiness checks and pre-motion timing

search_ports:
  - "/dev/ttyUSB0"
baudrate: 115200
status_poll_rate: 0.2

coil_frequency_hz: 0.2
default_amplitude_v: 5.0
default_offset_v: 2.5

initial_configs:
  - channel_index: 1
    waveform: 2
    frequency: 0.2
    amplitude: 5.0
    offset: 2.5
    phase: 0.0
    duty_cycle: 25.0
    output_en: false
    output_sync: true
  - channel_index: 2
    waveform: 2
    frequency: 0.2
    amplitude: 5.0
    offset: 2.5
    phase: 90.0
    duty_cycle: 25.0
    output_en: false
  - channel_index: 3
    waveform: 2
    frequency: 0.2
    amplitude: 5.0
    offset: 2.5
    phase: 180.0
    duty_cycle: 25.0
    output_en: false

n_sensors: 12
record_format: "csv"
use_calibrated: false
record_tf: true
tf_reference_frame: "lab_table"
tf_frames:
  - "sensor_array_filt"
  - "diana7_em_tcp_filt"
  - "arm1_em_tcp_filt"
  - "arm2_em_tcp_filt"

coil_timing:
  - name: "coil_1_on"
    channel: 1
    phase_deg: 0.0
    duty_cycle: 25.0
  - name: "coil_2_on"
    channel: 2
    phase_deg: 90.0
    duty_cycle: 25.0
  - name: "coil_3_on"
    channel: 3
    phase_deg: 180.0
    duty_cycle: 25.0
