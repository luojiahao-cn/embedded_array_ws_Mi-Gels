# MI-GELS default ZED2i profile for AprilTag/tagSLAM tracking.
# HD1080 is the practical 30 Hz step up from the ZED2i HD2K/15 Hz default.
# Use together with cameras_hd1080_30hz.yaml.
general:
  grab_resolution: 'HD1080'
  grab_frame_rate: 30
  pub_resolution: 'NATIVE'
  pub_frame_rate: 30.0

depth:
  depth_mode: 'ULTRA'

point_cloud_freq: 15.0
