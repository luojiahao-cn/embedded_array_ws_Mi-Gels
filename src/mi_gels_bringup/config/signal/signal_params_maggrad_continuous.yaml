# FY8300 信号发生器配置，用于 MagGrad 连续采集实验。
# 三个通道一次性配置为方波参数，但默认不打开输出。
# 大功率放大器输出由 experiment_orchestrator 在到达起点后的稳定窗口内使能，
# 并在采集结束或失败清理时关闭。
# 每个周期最后 25% 保持关闭，用作背景/无激励窗口。
# 采集节点会根据频率、相位和占空比给每帧 AK 传感器数据打标签；
# 录制过程中不会动态切换信号发生器通道输出。

# 候选串口。FY8300 通常通过 USB-串口枚举为 /dev/ttyUSB0。
search_ports:
  - "/dev/ttyUSB0"

# FY8300 串口通信波特率。
baudrate: 115200

# 状态轮询频率，单位 Hz。数值越大，状态查询越频繁。
status_poll_rate: 0.2

# 初始通道配置。
# waveform: 2 表示方波。
# amplitude/offset 单位按 signal_generator 节点约定传给 FY8300。
# phase 单位为度；duty_cycle 为占空比百分比。
initial_configs:
  # 通道 1：0 度相位，作为同步输出通道。
  - channel_index: 1
    waveform: 2
    frequency: 1.0
    amplitude: 5.0
    offset: 2.5
    phase: 0.0
    duty_cycle: 25.0
    output_en: false
    output_sync: true
  # 通道 2：相对通道 1 延迟 90 度。
  - channel_index: 2
    waveform: 2
    frequency: 1.0
    amplitude: 5.0
    offset: 2.5
    phase: 90.0
    duty_cycle: 25.0
    output_en: false
  # 通道 3：相对通道 1 延迟 180 度。
  - channel_index: 3
    waveform: 2
    frequency: 1.0
    amplitude: 5.0
    offset: 2.5
    phase: 180.0
    duty_cycle: 25.0
    output_en: false
