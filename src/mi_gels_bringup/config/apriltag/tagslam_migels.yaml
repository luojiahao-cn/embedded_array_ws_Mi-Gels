tagslam_parameters:
  optimizer_mode: fast
  minimum_viewing_angle: 5.0
  minimum_tag_area: 1000
  max_num_incremental_opt: 50000
  pixel_noise: 1.0
  max_subgraph_error: 50.0
  subgraph_abs_prior_position_noise: 0.1
  subgraph_abs_prior_rotation_noise: 0.1
  use_approximate_sync: false
  sync_queue_size: 1

body_defaults:
  position_noise: 0.05
  rotation_noise: 0.01

default_body: lab_table

bodies:
  - lab_table:
      is_static: true
      default_tag_size: 0.0803
      type: simple
      pose:
        position:
          x: 0.0
          y: 0.0
          z: 0.0
        rotation:
          x: 0.0
          y: 0.0
          z: 0.0
        position_noise:
          x: 1.0e-4
          y: 1.0e-4
          z: 1.0e-4
        rotation_noise:
          x: 1.0e-5
          y: 1.0e-5
          z: 1.0e-5
